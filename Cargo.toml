[package]
name = "leave-a-note"
version = "0.1.0"
edition = "2021"

[dependencies]
askama = "0.14.0"
axum = { version = "0.8.6", features = ["multipart"] }
chrono = "0.4.42"
json = "0.12.4"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.48.0", features = ["full"] }
tracing = "0.1.41"
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.20", features = ["local-time"] }
